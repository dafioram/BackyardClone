name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check inline JS syntax
        run: |
          node -e 'const fs=require("fs");const h=fs.readFileSync("index.html","utf8");const re=/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g;let m,n=0;while((m=re.exec(h))){fs.writeFileSync("/tmp/inline"+(n++)+".js",m[1]);}if(!n)throw new Error("no inline scripts found");console.log("found "+n+" inline script(s)");'
          for f in /tmp/inline*.js; do node --check "$f" || exit 1; done && echo "JS syntax OK"

      - name: Run Playwright smoke tests
        run: npx playwright test
